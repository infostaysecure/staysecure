<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free and premium StaySecure cybersecurity courses."><title>Courses | StaySecure</title>
<style>
:root{--navy:#06172a;--cyan:#12dbe5;--green:#23c879;--ink:#102b45;--muted:#61758a;--paper:#f2f7fb;--line:#d8e4ee}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}header{background:var(--navy);color:white;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:25px;font-weight:850}.brand b{color:var(--cyan)}nav{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:14px;font-size:14px}nav a:hover{color:var(--cyan)}.hero{background:linear-gradient(120deg,#06172a,#0a3657);color:white;padding:54px 0}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,48px);line-height:1.1;margin:10px 0}.hero p{color:#d2e3ef;max-width:650px}.main{padding:36px 0 60px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.filters button{border:1px solid #cbdbe8;background:white;border-radius:99px;padding:8px 15px;cursor:pointer;font:inherit;font-size:13px}.filters button.active{background:var(--navy);color:white;border-color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.art{height:118px;display:grid;place-items:center;background:radial-gradient(circle,#0d79ac,#06172a 75%);color:var(--cyan);font-size:40px}.body{padding:18px;display:flex;flex-direction:column;align-items:flex-start;flex:1}.tag{font-size:10px;letter-spacing:1px;font-weight:800;color:#078c6a;text-transform:uppercase}.card h2{font-size:19px;line-height:1.3;margin:7px 0}.card p{font-size:14px;color:var(--muted);margin:0 0 18px}.meta{font-size:12px;color:var(--muted);margin-top:auto}.link{display:inline-block;margin-top:14px;color:#007fa8;font-weight:800;font-size:13px}.message{background:white;border:1px solid var(--line);padding:18px;border-radius:10px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr}.nav{align-items:flex-start;flex-direction:column}.nav nav{justify-content:flex-start;gap:10px 16px;font-size:13px}.hero{padding:40px 0}}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">Stay<b>Secure</b></a><nav><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="blog.html">Blog</a></nav></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow">Learn at your pace</div><h1>Cybersecurity courses</h1><p>Build practical skills with clear lessons and knowledge checks. Start with free courses and keep growing your confidence.</p></div></section>
<main class="wrap main"><div class="filters" id="filters"><button class="active" data-tier="all">All courses</button><button data-tier="free">Free</button></div><div id="message" class="message">Loading courses…</div><div id="grid" class="grid"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script>
const $=id=>document.getElementById(id);let items=[],tier='all';
const fallback=[{id:'',slug:'cybersecurity-fundamentals',title:'Cybersecurity Fundamentals',excerpt:'Learn the everyday habits that protect your accounts, devices, and personal information.',category:'Cybersecurity Fundamentals',access_tier:'free',estimated_minutes:45},{id:'',slug:'phishing-and-online-scams',title:'Phishing & Online Scams',excerpt:'Practice spotting suspicious messages, fake login pages, and pressure tactics before you click.',category:'Threat Awareness',access_tier:'free',estimated_minutes:35}];
function render(){const list=items.filter(x=>tier==='all'||x.access_tier===tier);$('grid').innerHTML='';list.forEach(x=>{const a=document.createElement('article');a.className='card';a.innerHTML='<div class="art" aria-hidden="true">⌑</div><div class="body"><div class="tag"></div><h2></h2><p></p><div class="meta"></div><a class="link">Explore course →</a></div>';a.querySelector('.tag').textContent=x.access_tier==='free'?'Free course':'Premium course';a.querySelector('h2').textContent=x.title;a.querySelector('p').textContent=x.excerpt||'';a.querySelector('.meta').textContent=(x.category||'Cybersecurity')+' · '+(x.estimated_minutes||10)+' min';a.querySelector('a').href='course.html?slug='+encodeURIComponent(x.slug);$('grid').append(a)});if(!list.length)$('grid').innerHTML='<div class="message">No courses in this category yet.</div>'}
document.querySelectorAll('[data-tier]').forEach(b=>b.addEventListener('click',()=>{tier=b.dataset.tier;document.querySelectorAll('[data-tier]').forEach(x=>x.classList.toggle('active',x===b));render()}));
(async()=>{try{if(window.supabase&&window.STAYSECURE_SUPABASE_URL&&!window.STAYSECURE_SUPABASE_URL.includes('YOUR-PROJECT')&&window.STAYSECURE_SUPABASE_ANON_KEY&&!window.STAYSECURE_SUPABASE_ANON_KEY.includes('YOUR-SUPABASE')){const c=window.supabase.createClient(window.STAYSECURE_SUPABASE_URL,window.STAYSECURE_SUPABASE_ANON_KEY);const {data,error}=await c.from('content_items').select('id,slug,title,excerpt,category,access_tier,estimated_minutes').eq('kind','course').eq('status','published').eq('access_tier','free').order('published_at',{ascending:false});if(error)throw error;items=data||[];$('message').textContent=items.length?'Published free courses from StaySecure.':'No published courses yet. Add one in Content Studio.';}else{items=fallback;$('message').textContent='Preview content shown. Connect Supabase and run supabase/schema.sql to publish live content.';}}catch(e){items=fallback;$('message').textContent='Could not load live content. Showing starter preview. '+e.message;}render();})();
</script></body></html>
