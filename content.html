<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Learn | StaySecure</title>
<style>
:root{--navy:#06172a;--cyan:#12dbe5;--ink:#142e47;--muted:#5b7085;--paper:#f2f7fb;--line:#d8e4ee}*{box-sizing:border-box}body{margin:0;font:16px/1.7 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}a{color:inherit;text-decoration:none}.wrap{width:min(900px,calc(100% - 36px));margin:auto}header{background:var(--navy);color:white;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:25px;font-weight:850}.brand b{color:var(--cyan)}nav{display:flex;gap:20px;font-size:14px}.hero{background:linear-gradient(120deg,#06172a,#0a3657);color:white;padding:40px 0}.tag{font-size:11px;color:var(--cyan);letter-spacing:1.4px;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(32px,5vw,46px);line-height:1.15;margin:8px 0}.hero p{color:#d2e3ef}.meta{font-size:13px;color:#c2d7e6}.main{padding:30px 0 64px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:clamp(20px,4vw,40px)}.content{white-space:normal;overflow-wrap:anywhere}.content h2{margin-top:28px;font-size:24px}.content h3{margin-top:22px}.content p{margin:12px 0}.content li{margin:8px 0}.content a{color:#007da6;text-decoration:underline}.lessons{margin-top:22px;display:grid;gap:12px}.lesson{border:1px solid var(--line);border-radius:10px;padding:18px}.lesson h3{margin:0 0 8px}.course-player{margin-top:22px;background:white;border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,30px)}.player-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}.progress-track{height:8px;background:#e5edf4;border-radius:99px;overflow:hidden;margin:12px 0 22px}.progress-fill{height:100%;width:0;background:#23c879;transition:width .2s}.player-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.player-button{border:0;border-radius:7px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer;background:#087f9f;color:white}.player-button.secondary{background:#e8f0f5;color:#18344b}.player-button:disabled{opacity:.45;cursor:not-allowed}.start-button{margin-top:20px}.lesson-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.lesson-chip{border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;color:var(--muted)}.lesson-chip.current{background:#e7f7f0;border-color:#23c879;color:#176344}.complete-panel{background:#edf8f4;border:1px solid #b8e7d1;border-radius:10px;padding:22px;margin-top:18px}.notice{background:#edf8f4;border-left:4px solid #23c879;padding:12px 16px;border-radius:6px;color:#245c48;margin-bottom:20px}.message{color:var(--muted);padding:24px;background:white;border-radius:10px}@media(max-width:520px){nav{gap:10px 14px;font-size:12px;flex-wrap:wrap;justify-content:flex-end}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Stay<b>Secure</b></a><nav><a href="courses.html">Courses</a><a href="blog.html">Blog</a></nav></div></header><section class="hero"><div class="wrap"><div class="tag" id="category">StaySecure learning</div><h1 id="title">Loading content…</h1><p id="excerpt"></p><div class="meta" id="meta"></div></div></section><main class="wrap main"><div id="notice" class="notice" hidden>Free learning content. Sign-in and progress tracking will be enabled in a later setup step.</div><div id="message" class="message">Loading article or course…</div><article id="body" class="panel content" hidden></article><section id="coursePlayer" class="course-player" hidden aria-live="polite"></section><section id="lessons" class="lessons" hidden></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script>
const $=id=>document.getElementById(id);const slug=new URLSearchParams(location.search).get('slug');
const fallback={
'cybersecurity-fundamentals':{kind:'course',slug:'cybersecurity-fundamentals',title:'Cybersecurity Fundamentals',category:'Cybersecurity Fundamentals',estimated_minutes:45,excerpt:'Learn the everyday habits that protect your accounts, devices, and personal information.',body:'## What you will learn\n\nThis beginner-friendly course introduces the core ideas behind personal cybersecurity. Learn to recognize common risks, choose safer account settings, keep devices updated, and respond calmly when something seems suspicious.'},
'phishing-and-online-scams':{kind:'course',slug:'phishing-and-online-scams',title:'Phishing & Online Scams',category:'Threat Awareness',estimated_minutes:35,excerpt:'Practice spotting suspicious messages, fake login pages, and pressure tactics before you click.',body:'## Pause before you click\n\nPhishing messages try to make you act quickly, reveal information, open an attachment, or visit a deceptive website. Verify requests through a separate trusted channel.'},
'strong-passwords-and-passkeys':{kind:'blog',slug:'strong-passwords-and-passkeys',title:'Stronger Passwords: Password Managers and Passkeys',category:'Everyday Security',estimated_minutes:6,excerpt:'Learn how unique passwords, password managers, and passkeys reduce the risk of account takeover.',body:'## Use a unique password for every account\n\nA password manager can create and store long, unique passwords so you do not have to memorize them all. Turn on multi-factor authentication for important accounts.'},
'spot-phishing-messages':{kind:'blog',slug:'spot-phishing-messages',title:'How to Spot a Phishing Message',category:'Threat Awareness',estimated_minutes:5,excerpt:'A practical checklist for recognizing suspicious email, texts, and direct messages.',body:'## Verify separately\n\nAvoid clicking links in suspicious messages. Visit the organization through a known bookmark or official app, or call a trusted number you already have.'}
};
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function markdown(s){const lines=String(s||'').split(/\r?\n/);let out='',list=false;for(const raw of lines){const t=raw.trim();if(/^[-*] /.test(t)){if(!list){out+='<ul>';list=true;}out+='<li>'+escapeHtml(t.slice(2))+'</li>';continue;}if(list){out+='</ul>';list=false;}if(!t)continue;if(t.startsWith('### '))out+='<h3>'+escapeHtml(t.slice(4))+'</h3>';else if(t.startsWith('## '))out+='<h2>'+escapeHtml(t.slice(3))+'</h2>';else if(t.startsWith('# '))out+='<h2>'+escapeHtml(t.slice(2))+'</h2>';else out+='<p>'+escapeHtml(t)+'</p>';}if(list)out+='</ul>';return out;}
function show(item,lessons=[]){
 $('category').textContent=item.kind==='course'?'Course · '+item.category:item.category||'Cybersecurity';
 $('title').textContent=item.title;$('excerpt').textContent=item.excerpt||'';
 $('meta').textContent=(item.estimated_minutes||5)+' min '+(item.kind==='course'?'course':'read')+' · '+(item.access_tier||'free')+' access';
 $('body').innerHTML=markdown(item.body);$('body').hidden=false;$('message').hidden=true;$('notice').hidden=item.access_tier!=='free';
 if(item.kind==='course'){
   $('body').hidden=true;
   const player=$('coursePlayer');player.hidden=false;
   if(!lessons.length){
     player.innerHTML='<h2>Course lessons are being prepared</h2><p>This course page is available, but no lesson content was returned. Please check back soon.</p>';
     return;
   }
   let current=-1;const completed=new Set();
   function render(){
     const total=lessons.length;
     if(current<0){
       player.innerHTML='<h2>Ready to begin?</h2><p>Start this course to work through '+total+' lesson'+(total===1?'':'s')+' at your own pace. Your progress indicator is shown on this page during this visit.</p><button class="player-button start-button" id="startCourse">Start Course</button><div class="lesson-list">'+lessons.map((l,i)=>'<span class="lesson-chip">'+(i+1)+'. '+escapeHtml(l.title)+'</span>').join('')+'</div>';
       player.querySelector('#startCourse').addEventListener('click',()=>{current=0;render();});
       return;
     }
     if(current>=total){
       player.innerHTML='<div class="complete-panel"><h2>Course complete!</h2><p>You reached the end of '+escapeHtml(item.title)+'. Well done completing all '+total+' lessons.</p><button class="player-button secondary" id="reviewCourse">Review lessons</button></div>';
       player.querySelector('#reviewCourse').addEventListener('click',()=>{current=0;render();});
       return;
     }
     const l=lessons[current];const pct=Math.round(completed.size/total*100);
     player.innerHTML='<div class="player-top"><span>Lesson '+(current+1)+' of '+total+'</span><span>'+completed.size+' of '+total+' completed</span></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="progress-fill" style="width:'+pct+'%"></div></div><h2>'+escapeHtml(l.title)+'</h2><div class="content">'+markdown(l.body)+'</div><div class="player-controls"><button class="player-button secondary" id="previous" '+(current===0?'disabled':'')+'>Previous</button><button class="player-button" id="next">'+(current===total-1?'Complete Course':'Mark Complete & Continue')+'</button></div><div class="lesson-list">'+lessons.map((x,i)=>'<span class="lesson-chip '+(i===current?'current':'')+'">'+(completed.has(i)?'✓ ':'')+(i+1)+'. '+escapeHtml(x.title)+'</span>').join('')+'</div>';
     player.querySelector('#previous').addEventListener('click',()=>{current=Math.max(0,current-1);render();});
     player.querySelector('#next').addEventListener('click',()=>{completed.add(current);current++;render();});
   }
   render();
 }else{
   $('coursePlayer').hidden=true;
   $('body').hidden=false;
 }
}
(async()=>{if(!slug){$('message').textContent='Choose a course or article from the Courses or Blog pages.';return;}try{let item=null,lessons=[];if(window.supabase&&window.STAYSECURE_SUPABASE_URL&&!window.STAYSECURE_SUPABASE_URL.includes('YOUR-PROJECT')&&window.STAYSECURE_SUPABASE_ANON_KEY&&!window.STAYSECURE_SUPABASE_ANON_KEY.includes('YOUR-SUPABASE')){const c=window.supabase.createClient(window.STAYSECURE_SUPABASE_URL,window.STAYSECURE_SUPABASE_ANON_KEY);const r=await c.from('content_items').select('*').eq('slug',slug).eq('status','published').eq('access_tier','free').maybeSingle();if(r.error)throw r.error;item=r.data;if(item&&item.kind==='course'){const lr=await c.from('content_lessons').select('title,body,position,estimated_minutes').eq('course_id',item.id).order('position');if(lr.error)throw lr.error;lessons=lr.data||[];}}if(!item){item=fallback[slug];}if(!item){$('message').textContent='We could not find that published free item. It may be unpublished or require membership.';return;}show(item,lessons);}catch(e){const item=fallback[slug];if(item)show(item);else $('message').textContent='Could not load this content. '+e.message;}})();
</script></body></html>
