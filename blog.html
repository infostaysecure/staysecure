<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Practical cybersecurity advice from StaySecure."><title>Cybersecurity Blog | StaySecure</title>
<style>
:root{--navy:#06172a;--cyan:#12dbe5;--ink:#102b45;--muted:#61758a;--paper:#f2f7fb;--line:#d8e4ee}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}header{background:var(--navy);color:white;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:25px;font-weight:850}.brand b{color:var(--cyan)}nav{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:14px;font-size:14px}nav a:hover{color:var(--cyan)}.hero{background:linear-gradient(120deg,#06172a,#0a3657);color:white;padding:54px 0}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,48px);line-height:1.1;margin:10px 0}.hero p{color:#d2e3ef;max-width:650px}.main{padding:36px 0 60px}.search{width:100%;max-width:480px;padding:12px 14px;border:1px solid #cbdbe8;border-radius:9px;font:inherit;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.art{height:118px;display:grid;place-items:center;background:radial-gradient(circle,#0d79ac,#06172a 75%);color:var(--cyan);font-size:38px}.body{padding:18px;display:flex;flex-direction:column;align-items:flex-start;flex:1}.tag{font-size:10px;letter-spacing:1px;font-weight:800;color:#078c6a;text-transform:uppercase}.card h2{font-size:19px;line-height:1.3;margin:7px 0}.card p{font-size:14px;color:var(--muted);margin:0 0 18px}.meta{font-size:12px;color:var(--muted);margin-top:auto}.link{display:inline-block;margin-top:14px;color:#007fa8;font-weight:800;font-size:13px}.message{background:white;border:1px solid var(--line);padding:18px;border-radius:10px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr}.nav{align-items:flex-start;flex-direction:column}.nav nav{justify-content:flex-start;gap:10px 16px;font-size:13px}.hero{padding:40px 0}}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">Stay<b>Secure</b></a><nav><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="blog.html">Blog</a></nav></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow">Stay informed</div><h1>Cybersecurity insights</h1><p>Clear, practical advice to help you protect your accounts, devices, information, and business.</p></div></section>
<main class="wrap main"><input id="search" class="search" type="search" placeholder="Search articles by title or topic…" aria-label="Search articles"><div id="message" class="message">Loading articles…</div><div id="grid" class="grid"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script>
const $=id=>document.getElementById(id);let items=[];
const fallback=[{slug:'strong-passwords-and-passkeys',title:'Stronger Passwords: Password Managers and Passkeys',excerpt:'Learn how unique passwords, password managers, and passkeys reduce the risk of account takeover.',category:'Everyday Security',estimated_minutes:6},{slug:'spot-phishing-messages',title:'How to Spot a Phishing Message',excerpt:'A practical checklist for recognizing suspicious email, texts, and direct messages.',category:'Threat Awareness',estimated_minutes:5},{slug:'multi-factor-authentication-guide',title:'Multi-Factor Authentication: A Practical Guide',excerpt:'Add another layer of protection to important accounts and learn which methods to prefer.',category:'Security Basics',estimated_minutes:6},{slug:'secure-your-phone-and-computer',title:'Simple Ways to Secure Your Phone and Computer',excerpt:'Updates, screen locks, backups, and app hygiene make a meaningful difference.',category:'Device Security',estimated_minutes:5},{slug:'avoid-online-shopping-scams',title:'How to Avoid Online Shopping and Payment Scams',excerpt:'A few checks can help you avoid fake stores, fraudulent payment requests, and too-good-to-be-true offers.',category:'Scam Awareness',estimated_minutes:5},{slug:'protect-your-personal-information',title:'Protecting Your Personal Information Online',excerpt:'Review privacy settings, limit oversharing, and reduce the amount of personal data exposed online.',category:'Privacy Basics',estimated_minutes:5}];
function render(){const q=$('search').value.toLowerCase().trim();const list=items.filter(x=>(x.title+' '+x.excerpt+' '+x.category).toLowerCase().includes(q));$('grid').innerHTML='';list.forEach(x=>{const a=document.createElement('article');a.className='card';a.innerHTML='<div class="art" aria-hidden="true">⌁</div><div class="body"><div class="tag"></div><h2></h2><p></p><div class="meta"></div><a class="link">Read article →</a></div>';a.querySelector('.tag').textContent=x.category||'Cybersecurity';a.querySelector('h2').textContent=x.title;a.querySelector('p').textContent=x.excerpt||'';a.querySelector('.meta').textContent=(x.estimated_minutes||5)+' min read';a.querySelector('a').href='content.html?slug='+encodeURIComponent(x.slug);$('grid').append(a)});if(!list.length)$('grid').innerHTML='<div class="message">No articles match that search.</div>'}
$('search').addEventListener('input',render);
(async()=>{try{if(window.supabase&&window.STAYSECURE_SUPABASE_URL&&!window.STAYSECURE_SUPABASE_URL.includes('YOUR-PROJECT')&&window.STAYSECURE_SUPABASE_ANON_KEY&&!window.STAYSECURE_SUPABASE_ANON_KEY.includes('YOUR-SUPABASE')){const c=window.supabase.createClient(window.STAYSECURE_SUPABASE_URL,window.STAYSECURE_SUPABASE_ANON_KEY);const {data,error}=await c.from('content_items').select('slug,title,excerpt,category,estimated_minutes,published_at').eq('kind','blog').eq('status','published').eq('access_tier','free').order('published_at',{ascending:false});if(error)throw error;items=data||[];$('message').textContent=items.length?'Latest articles from StaySecure.':'No published articles yet. Add one in Content Studio.';}else{items=fallback;$('message').textContent='Preview articles shown. Connect Supabase and run supabase/schema.sql to publish live content.';}}catch(e){items=fallback;$('message').textContent='Could not load live articles. Showing starter preview. '+e.message;}render();})();
</script></body></html>
